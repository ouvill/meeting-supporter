[package]
name = "meeting-desktop-runtime"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "AGPL-3.0-only"
publish = false

[dependencies]
meeting-session = { path = "../meeting-session" }
meeting-storage = { path = "../meeting-storage" }
meeting-media-runtime = { path = "../meeting-media-runtime" }
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["cors", "fs"] }
tower = { version = "0.5", features = ["util"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "net", "sync", "time", "io-util", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
toml = "0.8"
tempfile = "3"

rig = { package = "rig-core", version = "=0.42.0", default-features = false, features = ["reqwest", "rustls"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream"] }
futures-util = "0.3"
base64 = "0.22"
sha2 = "0.10"
sha1 = "0.10"
fs2 = "0.4"
dirs = "6"

[dev-dependencies]
tempfile = "3"

[features]
test-fixtures = ["dep:hound"]

[dependencies.hound]
version = "3.5"
optional = true

[[bin]]
name = "synthetic-worker"
path = "tests/support/worker.rs"
required-features = ["test-fixtures"]

[dev-dependencies.tokio-tungstenite]
version = "0.29"

[dev-dependencies.futures-util]
version = "0.3"
features = ["sink"]

[dev-dependencies.zip]
version = "4.6.1"
default-features = false
features = ["deflate-flate2-zlib-rs"]
