[package]
name = "meeting-audio-runtime"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "AGPL-3.0-only"
repository = "https://github.com/ouvill/meeting-supporter"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
hound = "3.5"
cpal = "0.18.2"
ringbuf = "0.4.8"
rubato = { version = "0.16.2", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
# CPAL does not expose the source-to-monitor relationship; use Pulse only for
# device metadata so existing saved source IDs keep working.
cpal = { version = "0.18.2", features = ["pulseaudio"] }
libpulse-binding = "2.30"
