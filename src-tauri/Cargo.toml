[package]
name = "meeting-supporter"
version = "0.1.0"
description = "Desktop meeting assistant that suggests the next response"
authors = ["Meeting Supporter contributors"]
license = "AGPL-3.0-only"
edition = "2021"


[lib]
name = "meeting_supporter_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
native-speech = []
webdriver = ["dep:tauri-plugin-wdio", "dep:tauri-plugin-wdio-webdriver"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
meeting-desktop-runtime = { path = "../crates/meeting-desktop-runtime" }
meeting-speech-runtime = { path = "../crates/meeting-speech-runtime" }
# Tauri 2.12 includes Tao's Wayland titlebar fixes for initially hidden windows.
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-wdio = { version = "1.2.0", optional = true }
# Published 1.4.0 still uses incompatible Windows bindings with Tauri 2.12.
# Pin the upstream fix until it is released: https://github.com/webdriverio/desktop-mobile/pull/687
tauri-plugin-wdio-webdriver = { git = "https://github.com/webdriverio/desktop-mobile", rev = "e4bdb66ec5b1d96b7fd766d70370a8e8361e0459", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
ctrlc = { version = "3", features = ["termination"] }
thiserror = "1"
ureq = { version = "3", features = ["json"] }
sha2 = "0.10"
base64 = "0.22"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
jsonwebtoken = "10"
url = "2"

[dev-dependencies]
serde_json = "1"
