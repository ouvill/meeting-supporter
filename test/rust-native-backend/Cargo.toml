[package]
name = "meeting-native-backend"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "AGPL-3.0-only"
publish = false

[features]
default = ["whisper"]
whisper = ["dep:whisper-rs"]
vulkan = ["whisper", "whisper-rs/vulkan"]
cuda = ["whisper", "whisper-rs/cuda"]
metal = ["whisper", "whisper-rs/metal"]
reazonspeech = ["dep:sherpa-onnx"]

[dependencies]
meeting-audio-core = { path = "../rust-audio-core" }
ort = { version = "=2.0.0-rc.12", default-features = false, features = ["std", "load-dynamic", "api-24"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
hound = "3.5"
cpal = "0.16"
rubato = { version = "0.16.2", default-features = false }
ringbuf = "0.4.8"
ctrlc = "3.4"
sherpa-onnx = { version = "=1.13.8", default-features = false, features = ["shared"], optional = true }

whisper-rs = { version = "=0.16.0", default-features = false, optional = true }
