[project]
name = "meeting-python-worker"
version = "0.1.0"
description = "On-demand Python operations owned by the Rust desktop runtime"
license = "AGPL-3.0-only"
requires-python = ">=3.12,<3.13"
dependencies = ["markitdown[docx]==0.1.8", "defusedxml==0.7.1"]

[dependency-groups]
build = ["pyinstaller==6.22.3"]
dev = ["pytest>=9,<10", "ruff>=0.15,<1"]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
