name: Tauri CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  desktop:
    name: Rust unit tests and Tauri desktop smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MANAGED_API_BASE_URL: ""
      OPENAI_API_KEY: ""
      GEMINI_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      DEEPGRAM_API_KEY: ""
      XAI_API_KEY: ""

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            curl \
            wget \
            file \
            libasound2-dev \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            openbox \
            pulseaudio \
            xvfb

      - name: Start virtual PulseAudio device
        run: |
          mkdir -p "$RUNNER_TEMP/pulse"
          pulseaudio --daemonize=yes --exit-idle-time=-1 \
            --load="module-native-protocol-unix socket=$RUNNER_TEMP/pulse/native auth-anonymous=1"
          export PULSE_SERVER="unix:$RUNNER_TEMP/pulse/native"
          pactl load-module module-null-sink sink_name=meeting_supporter_ci
          pactl set-default-sink meeting_supporter_ci
          echo "PULSE_SERVER=$PULSE_SERVER" >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990
        with:
          enable-cache: true
          cache-dependency-glob: python/uv.lock

      - name: Install backend and ACP test dependencies
        working-directory: python
        run: uv sync --locked

      - name: Prepare bundled Python resource
        run: npm run prepare:python-resource

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
        with:
          workspaces: "src-tauri -> target"

      - name: Run Rust unit tests
        working-directory: src-tauri
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked 2>&1 | tee "$RUNNER_TEMP/cargo-test.log"

      - name: Run Tauri WebdriverIO smoke test
        shell: bash
        run: xvfb-run -a npm run test:tauri:linux

      - name: Upload Rust unit failure log
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tauri-rust-unit-log-${{ github.run_id }}
          if-no-files-found: warn
          path: ${{ runner.temp }}/cargo-test.log
          retention-days: 3

      - name: Upload Tauri desktop failure logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tauri-desktop-log-${{ github.run_id }}
          if-no-files-found: warn
          path: logs/
          retention-days: 3
