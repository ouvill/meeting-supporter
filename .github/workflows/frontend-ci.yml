# Frontend CI
#
# Runs on pull_request and push to main.
# Executes type-check + bundle (`npm run build`), Vitest tests,
# and verifies that OpenAPI generated files are fresh
# (`npm run generate:api` then `git diff --exit-code`).
#
# Node version: 22 (LTS) — no .node-version file exists in the repo.
#
# ── Local reproduction ────────────────────────────────────────────────────────
# To reproduce these checks locally:
#   npm ci
#   npm run build
#   npm run test
#   npm run generate:api
#   git diff --exit-code -- openapi.json src/api/generated
# ──────────────────────────────────────────────────────────────────────────────

name: Frontend CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Frontend CI
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Rust for the API contract
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Cache Rust API generator
        uses: swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: crates/meeting-desktop-runtime -> target

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install npm dependencies
        run: npm ci

      - name: Check document governance
        run: npm run check:docs
      - name: Check release metadata and assets
        run: npm run check:release

      - name: Type-check and build
        run: npm run build

      - name: Run tests
        run: npm run test

      - name: Regenerate OpenAPI client and check freshness
        run: |
          npm run generate:api
          git diff --exit-code -- openapi.json src/api/generated
