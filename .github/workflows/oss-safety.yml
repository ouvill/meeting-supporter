name: OSS safety

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  audit:
    name: OSS safety
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"

      - name: Check public repository boundary
        run: npm run check:public

      - name: Install Gitleaks 8.30.1
        shell: bash
        run: |
          set -euo pipefail
          archive="gitleaks_8.30.1_linux_x64.tar.gz"
          curl --fail --silent --show-error --location \
            --output "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum --check --strict
          mkdir -p .gitleaks-bin
          tar -xzf "$archive" -C .gitleaks-bin gitleaks

      - name: Scan Git history
        run: ./.gitleaks-bin/gitleaks git --redact=100 --no-banner .

      - name: Scan current tree
        run: ./.gitleaks-bin/gitleaks dir --redact=100 --no-banner .
