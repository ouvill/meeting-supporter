name: MarkItDown worker CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: MarkItDown worker (Python 3.12)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
          cache-dependency-glob: python-worker/uv.lock
      - name: Lint and format
        run: |
          uv run --locked --project python-worker ruff check python-worker
          uv run --locked --project python-worker ruff format --check python-worker
      - name: Test document conversion
        run: uv run --locked --project python-worker pytest python-worker/tests
