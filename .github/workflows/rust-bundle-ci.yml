name: Rust installers

on:
  pull_request:
  push:
    branches: [main, "ci/rust-desktop-*"]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: rust-installers-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bundle:
    name: CPU installer (${{ matrix.platform }})
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-2022, ubuntu-22.04]
    env:
      MANAGED_API_BASE_URL: ""
      CARGO_TERM_COLOR: always
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CMAKE_POLICY_VERSION_MINIMUM: "3.5"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential clang cmake pkg-config libssl-dev libpulse-dev libasound2-dev \
            libayatana-appindicator3-dev libgtk-3-dev librsvg2-dev libwebkit2gtk-4.1-dev \
            libxdo-dev patchelf xdg-utils
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
          cache: npm
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          cache-dependency-glob: python-worker/uv.lock
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: |
            src-tauri -> target
            crates/meeting-audio-runtime -> ../../target/rust-bundle/meeting-audio-runtime
            test/rust-native-backend -> ../../target/rust-bundle/meeting-native-backend
          key: cpu-installer
      - run: npm ci
      - run: node --test scripts/test-native-runtime.mjs
      - name: Build the standard Rust installer with native and DOCX workers
        # The platform config owns the feature and resource preparation.
        run: npm run tauri -- build --ci
      - name: Load the bundled runtime and real speech models after relocation
        run: npm run test:rust-bundle -- --models
      - name: Verify the frozen DOCX worker without Python on PATH
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then suffix=.exe; else suffix=; fi
          export MEETING_TEST_PYTHON_WORKER="$GITHUB_WORKSPACE/generated/python-worker/dist/meeting-python-worker/meeting-python-worker$suffix"
          npm run test:python-worker
      - name: Upload installer candidates
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rust-installer-${{ runner.os }}-${{ github.sha }}
          if-no-files-found: error
          retention-days: 7
          path: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/rpm/*.rpm

  windows-desktop:
    name: Rust desktop E2E (Windows)
    runs-on: windows-2022
    timeout-minutes: 40
    env:
      MANAGED_API_BASE_URL: ""
      HF_HUB_OFFLINE: "1"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
          cache: npm
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: src-tauri -> ../target/rust-e2e
          key: windows-rust-e2e
      - run: npm ci
      - run: npm run test:tauri:types
      - name: Run isolated Rust desktop without Python or audio devices
        run: npm run test:tauri:rust
      - name: Upload synthetic failure logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-rust-e2e-${{ github.sha }}
          path: logs/
          if-no-files-found: ignore
          retention-days: 3
